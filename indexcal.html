<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>

<style>

body{
    background-color:darkslategray;
}
.ad {
    background-color: rgb(80, 131, 199);
    height: 400px;
    border: 4px dotted yellow;
    margin-top: 50px;
    padding: 30px 15px;
    text-align: center;
    border-radius: 35px;
    box-shadow: 0 5px 20px darkviolet;
    transition: 3.2s;
}

.ad:hover {
    background-color: aquamarine;
    transform: translatey(-30px);
}

.hy {
    width: 100%;
    max-width: 300px;
    height: 40px;
    margin-bottom: 15px;
    padding: 8px;
    border-radius: 8px;
}

.bt {
    border-radius: 50%;
    height: 50px;
    width: 50px;
    margin: 5px;
    background-color: rgb(222, 99, 32);
    border: 2px solid black;
}

.btn {
    min-height: 40px;
    border: 2px solid black;
    background-color: rgb(222, 99, 32);
    margin-top: 20px;
}


</style>

  <script>
function sum(){
    let a=parseInt(document.getElementById("t1").value);
    let b=parseInt(document.getElementById("t2").value);
    document.getElementById("res").innerHTML="sum is:-"+(a+b);
    document.getElementById("t1").value=" ";
    document.getElementById("t2").value=" ";

}
function sub(){
    let a=parseInt(document.getElementById("t1").value);
    let b=parseInt(document.getElementById("t2").value);
    document.getElementById("res").innerHTML="sub is:-"+(a-b);
    document.getElementById("t1").value=" ";
    document.getElementById("t2").value=" ";

}
function mult(){
    let a=parseInt(document.getElementById("t1").value);
    let b=parseInt(document.getElementById("t2").value);
    document.getElementById("res").innerHTML="mult is:-"+(a*b);
    document.getElementById("t1").value=" ";
    document.getElementById("t2").value=" ";

}
function div(){
    let a=parseInt(document.getElementById("t1").value);
    let b=parseInt(document.getElementById("t2").value);
    document.getElementById("res").innerHTML="div is:-"+(a/b);
    document.getElementById("t1").value=" ";
    document.getElementById("t2").value=" ";


}
function mod(){
    let a=parseInt(document.getElementById("t1").value);
    let b=parseInt(document.getElementById("t2").value);
    document.getElementById("res").innerHTML="mod is:-"+(a%b);
    document.getElementById("t1").value=" ";
    document.getElementById("t2").value=" ";


}

  </script>
  <body>

<div class="container">
<div class="row">
    <div class="col-sm-4"></div>
<div class="col-sm-4 ad">

<input type="text" id="t1" class="hy">
<input type="text"id="t2" class="hy">
<br>
<button class="bt" onclick="sum()">+</button>
<button class="bt" onclick="sub()">-</button>
<button  class="bt" onclick="mult()">*</button>
<button  class="bt" onclick="div()">/</button>
<button  class="bt" onclick="mod()">%</button>
<br>
<div  class="btn" id="res">output</div>
</div>
<div class="col-sm-4"></div>




</div>
</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
